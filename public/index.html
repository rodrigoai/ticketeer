<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticketeer - Event Management System</title>
    <meta name="description" content="Comprehensive ticket sales management system">

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts & Material Icons for Landing Page -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        .app-loading {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            color: #64748b;
            font-family: 'Inter', system-ui, sans-serif;
        }

        .app-loading__content {
            text-align: center;
        }

        .app-loading__spinner {
            width: 2.5rem;
            height: 2.5rem;
            margin: 0 auto;
            border: 4px solid #c7d2fe;
            border-top-color: #4f46e5;
            border-radius: 9999px;
            animation: app-loading-spin 0.8s linear infinite;
        }

        .app-loading__text {
            margin-top: 1rem;
            font-size: 1.25rem;
        }

        @keyframes app-loading-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <!-- Loading placeholder -->
        <div class="app-loading" aria-live="polite" aria-busy="true">
            <div class="app-loading__content">
                <div class="app-loading__spinner" aria-hidden="true"></div>
                <p class="app-loading__text">Loading Ticketeer...</p>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
